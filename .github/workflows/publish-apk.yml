name: Publish Prebuilt Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate and Publish Prebuilt Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prebuilt APK and checksum
        id: validate
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Missing prebuilt APK at $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Prebuilt APK at $APK_PATH is empty"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "::error::Missing SHA-256 checksum file at $SHA_PATH"
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          ACTUAL_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c%s "$APK_PATH")"
          APK_SIZE_HUMAN="$(du -h "$APK_PATH" | awk '{print $1}')"

          unzip -tq "$APK_PATH"

          echo "sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_human=${APK_SIZE_HUMAN}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.size_human }}
        run: |
          set -euo pipefail

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          DIRECT_DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          NOTES_FILE="$(mktemp)"
          printf '%s\n' \
            "Prebuilt debug APK compiled in Google AI Studio." \
            "" \
            "- **Tag:** \`${TAG}\`" \
            "- **Asset:** \`app-debug.apk\`" \
            "- **Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)" \
            "- **SHA-256:** \`${APK_SHA256}\`" \
            "- **Direct Latest Download:** ${DIRECT_DOWNLOAD_URL}" > "$NOTES_FILE"

          gh release create "$TAG" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            --title "Debug APK (${TAG})" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

          rm -f "$NOTES_FILE"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          echo "direct_url=${DIRECT_DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: success()
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          DIRECT_URL: ${{ steps.release.outputs.direct_url }}
          APK_SHA256: ${{ steps.validate.outputs.sha256 }}
          APK_SIZE_BYTES: ${{ steps.validate.outputs.size_bytes }}
          APK_SIZE_HUMAN: ${{ steps.validate.outputs.size_human }}
        run: |
          {
            echo "## Prebuilt Debug APK Published"
            echo ""
            echo "- **Release Tag:** \`${TAG}\`"
            echo "- **APK Size:** ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes)"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **GitHub Release Page:** ${RELEASE_URL}"
            echo "- **Direct Latest APK Download URL:** ${DIRECT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
